[[options]]
id      = "add_to_path"
label   = "Add Pingy to the system PATH"
detail  = "Lets you run `Pingy` from any terminal. Changes PATH for every user on this machine."
default = true

[[options]]
id      = "desktop_shortcut"
label   = "Put a shortcut on the desktop"
default = false

# PerMonitorV2 DPI awareness, declared in the app manifest, landed in Windows 10
# 1703. Below that the manifest is ignored and the window renders blurry on any
# scaled display.
[[preflight]]
type = "os_build"
min  = 15063
fail = "Windows 10 version 1703 or later is required."

# A running Pingy holds its own image open, so the copy would fail partway
# through. restart_manager offers to close it instead of dead-ending.
[[preflight]]
type            = "process_not_running"
name            = "Pingy.exe"
restart_manager = true
fail            = "Close Pingy before installing."

[[actions]]
type   = "shortcut"
target = "{InstallDir}\\Pingy.exe"
where  = "common_programs"
name   = "Pingy"

[[actions]]
type   = "shortcut"
target = "{InstallDir}\\Pingy.exe"
where  = "desktop"
name   = "Pingy"
when   = "desktop_shortcut"

# The install directory itself, since Pingy.exe is the only thing in it.
[[actions]]
type  = "path_append"
value = "{InstallDir}"
when  = "add_to_path"

[[actions]]
type = "arp"
