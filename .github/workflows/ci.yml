name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        shell: pwsh
        run: |
          # build.bat has no error checks and ends with popd, so its exit code is
          # popd's and is always 0. Clear the target first and assert it came
          # back, otherwise a failed compile reports a green build.
          Remove-Item build/Pingy.exe -ErrorAction SilentlyContinue

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $install = & $vswhere -latest -products * `
                                -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                                -property installationPath
          if (-not $install) { throw 'no Visual Studio installation with the C++ x64 toolset' }

          $vcvars = Join-Path $install 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /c "call `"$vcvars`" >nul 2>&1 && call build.bat"

          if (-not (Test-Path build/Pingy.exe)) { throw 'build produced no build/Pingy.exe' }
          Get-Item build/Pingy.exe | Select-Object Name, Length | Format-Table -AutoSize

      # Pinned rather than 'latest' so a Forge release cannot change what this
      # repository builds without a commit here.
      - name: Fetch Forge
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.2.0 --repo Locke-Werks/Forge --pattern '*.exe' --dir tools

      # Builds the installer unsigned on every push, so a bad token, a `when`
      # naming an option that no longer exists, or a payload path that stopped
      # matching fails here rather than at release time.
      - name: Forge a development installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item build/Pingy.exe stage/

          ./tools/lwforge.exe build `
            --config installer.toml `
            --payload stage `
            --stub tools/lwstub.exe `
            --out dist/Pingy-Setup-dev.exe `
            --dev
          if ($LASTEXITCODE -ne 0) { throw "forge exited $LASTEXITCODE" }

          ./tools/lwforge.exe inspect dist/Pingy-Setup-dev.exe
          if ($LASTEXITCODE -ne 0) { throw 'the installer cannot read its own container' }

      - uses: actions/upload-artifact@v5
        with:
          name: Pingy-dev
          path: |
            build/Pingy.exe
            dist/Pingy-Setup-dev.exe
